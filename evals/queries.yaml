# evals/queries.yaml — Phase 2.5 ground-truth query set.
#
# Written blind, before running any of them or looking at search results, per
# PLAN.md's methodology: ground truth must never be constructed from search
# output, or the eval defines "relevant" as "what the default mode returns"
# and guarantees that mode wins by construction.
#
# Tags:
#   entity       — proper-noun-heavy; expected to favor sparse/BM25 (Phase 3)
#   paraphrase   — conceptual rephrasing, no exact source wording; expected
#                  to favor dense
#   temporal     — evolution/change over time; the project's longitudinal thesis
#   multi-source — synthesis across differing outlets/perspectives

